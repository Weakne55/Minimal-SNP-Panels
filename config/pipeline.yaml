# Один SLURM array на все образцы, независимо от вида.
# Хромосомы внутри WGS и joint обрабатываются последовательно.
trim_fastq: false

slurm:
  partition: main
  nodelist: meduza-1  # Узел должен поддерживать AVX2 для BWA-MEM3
  max_parallel_samples: 3

  # CPU/RAM и предельное время отдельного животного.
  sample:
    cpus: 16
    memory: 64G
    time: "2-00:00:00"

  # CPU/RAM и предельное время joint-обработки одного вида.
  joint:
    cpus: 8
    memory: 48G
    time: "2-00:00:00"
