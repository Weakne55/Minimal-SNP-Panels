[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minsnp"
version = "0.1.0"
description = "WGS, population structure and minimal SNP panels"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "numpy>=2", "scikit-learn>=1.5", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
minsnp = "minsnp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
