# Replace all /PATH/... paths and contig names before production runs.
# Sample path and workdir relative paths are interpreted relative to PROJECT ROOT.
samples: config/samples.tsv
workdir: /PATH/TO/WORKDIR/wgs_gatk_run

references:
  Delphinapterus_leucas:
    fasta: /PATH/TO/REFERENCES/beluga.fa
    # EXACT names in beluga.fa.fai, in the same order. Start with autosomes.
    contigs: [CONTIG1, CONTIG2]
  Ursus_maritimus:
    fasta: /PATH/TO/REFERENCES/polar_bear.fa
    contigs: [CONTIG1, CONTIG2]

preprocessing:
  trim_fastq: false  # Enable fastp only if needed; otherwise stream raw FASTQ to BWA-MEM.

duplicate_marking:
  optical_distance: 0  # 0: optical-duplicate classification disabled.

gatk:
  hc_threads: 4
  hc_heap_gb: 16
  db_heap_gb: 24
  genotype_heap_gb: 12
  db_batch_size: 50
  db_readers: 1

slurm:
  max_array_parallel: 4
