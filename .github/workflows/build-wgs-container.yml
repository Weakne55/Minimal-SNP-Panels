name: Build WGS OCI image for Apptainer
on:
  workflow_dispatch:
  push:
    branches: [snakemake]
    paths:
      - containers/Dockerfile.snakemake
      - envs/wgs-gatk-mem3.yaml
      - .github/workflows/build-wgs-container.yml
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image repository name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-wgs" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.snakemake
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:snakemake
            ${{ steps.image.outputs.name }}:${{ github.sha }}
