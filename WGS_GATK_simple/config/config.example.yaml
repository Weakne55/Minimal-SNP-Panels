# НАСТРОЙКИ ЗАПУСКА. Сначала измените пути и названия аутосом.
# Пути относительно проекта допустимы для samples и workdir.

samples: config/samples.tsv
workdir: /PATH/TO/WORKDIR/wgs_gatk_run   # папка результатов, НЕ внутри репозитория

references:
  Delphinapterus_leucas:
    fasta: /PATH/TO/REFERENCES/beluga.fa
    contigs: [CONTIG1, CONTIG2]  # замените на реальные аутосомы из beluga.fa.fai
  Ursus_maritimus:
    fasta: /PATH/TO/REFERENCES/polar_bear.fa
    contigs: [CONTIG1, CONTIG2]  # замените на реальные аутосомы из polar_bear.fa.fai

# Необязательные настройки: закомментированное = значение по умолчанию.
# Уберите # только у тех опций, которые собираетесь менять.

